<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${book.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5" style="max-width: 640px;">
    <div class="d-flex align-items-center gap-3 mb-4">
        <img th:if="${book.coverImageUrl}" th:src="@{${book.coverImageUrl}}" alt="Cover"
             style="width:64px;height:auto;border-radius:4px;box-shadow:var(--shadow-card);">
        <div>
            <span class="eyebrow d-block" th:text="${book.author}">Author</span>
            <h3 class="mb-0" th:text="${book.name}">Book title</h3>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(book.takeaways)}" class="empty-state">
        <span class="eyebrow">Nothing here yet</span>
        <h3>No takeaways yet</h3>
        <p>This book hasn't been summarized yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(book.takeaways)}" class="reader-panel form-panel p-4 p-md-5">
        <div class="reader-progress mb-4">
            <span class="eyebrow" id="reader-progress-label">Takeaway 1 of <span th:text="${#lists.size(book.takeaways)}"></span></span>
            <div class="reader-progress-bar mt-2">
                <div class="reader-progress-fill" id="reader-progress-fill"></div>
            </div>
        </div>

        <div th:each="page, iter : ${book.takeaways}" class="reader-page" th:data-index="${iter.index}">
            <h4 th:text="${page.heading}">Heading</h4>
            <p th:text="${page.content}" style="white-space: pre-line;">Content</p>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-secondary" id="reader-prev" onclick="readerGo(-1)">
                <i class="fa-solid fa-arrow-left me-1"></i> Previous
            </button>
            <button type="button" class="btn btn-primary" id="reader-next" onclick="readerGo(1)">
                Next <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
        </div>
        <p class="text-center mt-2 mb-0 small" style="color: var(--ink-soft); opacity: 0.7;">
            <i class="fa-solid fa-keyboard me-1"></i> Use the &larr; and &rarr; arrow keys to navigate too
        </p>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    let readerIndex = 0;
    const readerTotal = /*[[${#lists.size(book.takeaways)}]]*/ 0;

    function readerRender() {
        document.querySelectorAll('.reader-page').forEach((el) => {
            el.style.display = (parseInt(el.getAttribute('data-index')) === readerIndex) ? 'block' : 'none';
        });
        document.getElementById('reader-progress-label').textContent = 'Takeaway ' + (readerIndex + 1) + ' of ' + readerTotal;
        document.getElementById('reader-progress-fill').style.width = (((readerIndex + 1) / readerTotal) * 100) + '%';
        document.getElementById('reader-prev').disabled = readerIndex === 0;
        document.getElementById('reader-next').textContent = '';
        const nextBtn = document.getElementById('reader-next');
        if (readerIndex === readerTotal - 1) {
            nextBtn.innerHTML = 'Done <i class="fa-solid fa-check ms-1"></i>';
        } else {
            nextBtn.innerHTML = 'Next <i class="fa-solid fa-arrow-right ms-1"></i>';
        }
    }

    function readerGo(delta) {
        if (readerIndex === readerTotal - 1 && delta === 1) {
            window.location.href = '/available_books';
            return;
        }
        readerIndex = Math.min(Math.max(readerIndex + delta, 0), readerTotal - 1);
        readerRender();
    }

    if (readerTotal > 0) {
        readerRender();
        // Arrow-key navigation alongside the Previous/Next buttons - skipped
        // while focus is on a form control so it doesn't hijack typing
        // elsewhere on the page.
        document.addEventListener('keydown', (event) => {
            const tag = document.activeElement ? document.activeElement.tagName : '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                return;
            }
            if (event.key === 'ArrowLeft') {
                readerGo(-1);
            } else if (event.key === 'ArrowRight') {
                readerGo(1);
            }
        });
    }
</script>
</body>
</html>
