<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${book.name})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5" style="max-width: 640px;">
    <div class="d-flex align-items-center gap-3 mb-4">
        <img th:if="${book.coverImageUrl}" th:src="@{${book.coverImageUrl}}" alt="Cover"
             style="width:64px;height:auto;border-radius:4px;box-shadow:var(--shadow-card);">
        <div>
            <span class="eyebrow d-block" th:text="${book.author}">Author</span>
            <h3 class="mb-0" th:text="${book.name}">Book title</h3>
            <span class="rating-badge mt-1" th:if="${ratingSummary.count > 0}">
                <i class="fa-solid fa-star"></i>
                <span th:text="${#numbers.formatDecimal(ratingSummary.average, 1, 1)}">4.3</span>
                <span class="text-muted">(<span th:text="${ratingSummary.count}"></span> <span th:text="${ratingSummary.count == 1 ? 'review' : 'reviews'}"></span>)</span>
            </span>
            <span class="rating-badge mt-1 text-muted" th:unless="${ratingSummary.count > 0}">No reviews yet</span>
        </div>
        <a th:href="@{/available_books/{id}/share(id=${book.id})}" class="icon-link ms-auto" title="Share this book"
           target="_blank" rel="noopener">
            <i class="fa-solid fa-share-nodes"></i>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(book.takeaways)}" class="empty-state">
        <span class="eyebrow">Nothing here yet</span>
        <h3>No takeaways yet</h3>
        <p>This book hasn't been summarized yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(book.takeaways)}" class="reader-panel form-panel p-4 p-md-5">
        <div class="reader-progress mb-4">
            <span class="eyebrow" id="reader-progress-label">Takeaway 1 of <span th:text="${#lists.size(book.takeaways)}"></span></span>
            <div class="reader-progress-bar mt-2">
                <div class="reader-progress-fill" id="reader-progress-fill"></div>
            </div>
        </div>

        <div th:each="page, iter : ${book.takeaways}" class="reader-page" th:data-index="${iter.index}">
            <h4 th:text="${page.heading}">Heading</h4>
            <p th:text="${page.content}" style="white-space: pre-line;">Content</p>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button type="button" class="btn btn-secondary" id="reader-prev" onclick="readerGo(-1)">
                <i class="fa-solid fa-arrow-left me-1"></i> Previous
            </button>
            <button type="button" class="btn btn-primary" id="reader-next" onclick="readerGo(1)">
                Next <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
        </div>
        <p class="text-center mt-2 mb-0 small" style="color: var(--ink-soft); opacity: 0.7;">
            <i class="fa-solid fa-keyboard me-1"></i> Use the &larr; and &rarr; arrow keys to navigate too
        </p>
    </div>

    <div class="form-panel p-4 mt-4">
        <span class="eyebrow d-block mb-3" th:text="${ownReview != null ? 'Edit your review' : 'Rate this book'}"></span>
        <div class="alert alert-danger" th:if="${reviewError}" th:text="${reviewError}"></div>
        <form th:action="@{/available_books/{id}/review(id=${book.id})}" method="post">
            <div class="star-rating mb-3">
                <input type="radio" id="star5" name="rating" value="5" required
                       th:checked="${ownReview != null and ownReview.rating == 5}">
                <label for="star5" title="5 stars"><i class="fa-solid fa-star"></i></label>
                <input type="radio" id="star4" name="rating" value="4" required
                       th:checked="${ownReview != null and ownReview.rating == 4}">
                <label for="star4" title="4 stars"><i class="fa-solid fa-star"></i></label>
                <input type="radio" id="star3" name="rating" value="3" required
                       th:checked="${ownReview != null and ownReview.rating == 3}">
                <label for="star3" title="3 stars"><i class="fa-solid fa-star"></i></label>
                <input type="radio" id="star2" name="rating" value="2" required
                       th:checked="${ownReview != null and ownReview.rating == 2}">
                <label for="star2" title="2 stars"><i class="fa-solid fa-star"></i></label>
                <input type="radio" id="star1" name="rating" value="1" required
                       th:checked="${ownReview != null and ownReview.rating == 1}">
                <label for="star1" title="1 star"><i class="fa-solid fa-star"></i></label>
            </div>
            <textarea name="comment" class="form-control mb-3" rows="3" maxlength="2000"
                      placeholder="What did you think? (optional)"
                      th:text="${ownReview != null ? ownReview.comment : ''}"></textarea>
            <button type="submit" class="btn btn-primary btn-sm"
                    th:text="${ownReview != null ? 'Update review' : 'Submit review'}"></button>
        </form>
        <form th:if="${ownReview != null}"
              th:action="@{/available_books/{bookId}/review/{reviewId}/delete(bookId=${book.id}, reviewId=${ownReview.id})}"
              method="post" class="d-inline mt-2"
              onsubmit="return confirm('Delete your review?');">
            <button type="submit" class="btn btn-link btn-sm text-danger p-0">Delete my review</button>
        </form>
    </div>

    <div class="mt-4" th:unless="${#lists.isEmpty(reviews)}">
        <span class="eyebrow d-block mb-3">Reader reviews</span>
        <div class="review-card mb-3" th:each="r : ${reviews}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="fw-semibold" th:text="${r.user.username}">Reader</span>
                    <span class="star-display d-block">
                        <i th:each="i : ${#numbers.sequence(1,5)}"
                           th:class="${i <= r.rating ? 'fa-solid fa-star' : 'fa-regular fa-star'}"></i>
                    </span>
                </div>
                <span class="text-muted small" th:text="${#temporals.format(r.createdAt, 'MMM d, yyyy')}"></span>
            </div>
            <p class="mb-0 mt-2" th:if="${r.comment != null}" th:text="${r.comment}" style="white-space: pre-line;"></p>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    let readerIndex = 0;
    const readerTotal = /*[[${#lists.size(book.takeaways)}]]*/ 0;

    function readerRender() {
        document.querySelectorAll('.reader-page').forEach((el) => {
            el.style.display = (parseInt(el.getAttribute('data-index')) === readerIndex) ? 'block' : 'none';
        });
        document.getElementById('reader-progress-label').textContent = 'Takeaway ' + (readerIndex + 1) + ' of ' + readerTotal;
        document.getElementById('reader-progress-fill').style.width = (((readerIndex + 1) / readerTotal) * 100) + '%';
        document.getElementById('reader-prev').disabled = readerIndex === 0;
        document.getElementById('reader-next').textContent = '';
        const nextBtn = document.getElementById('reader-next');
        if (readerIndex === readerTotal - 1) {
            nextBtn.innerHTML = 'Done <i class="fa-solid fa-check ms-1"></i>';
        } else {
            nextBtn.innerHTML = 'Next <i class="fa-solid fa-arrow-right ms-1"></i>';
        }
    }

    function readerGo(delta) {
        if (readerIndex === readerTotal - 1 && delta === 1) {
            window.location.href = '/available_books';
            return;
        }
        readerIndex = Math.min(Math.max(readerIndex + delta, 0), readerTotal - 1);
        readerRender();
    }

    if (readerTotal > 0) {
        readerRender();
        // Arrow-key navigation alongside the Previous/Next buttons - skipped
        // while focus is on a form control so it doesn't hijack typing
        // elsewhere on the page.
        document.addEventListener('keydown', (event) => {
            const tag = document.activeElement ? document.activeElement.tagName : '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                return;
            }
            if (event.key === 'ArrowLeft') {
                readerGo(-1);
            } else if (event.key === 'ArrowRight') {
                readerGo(1);
            }
        });
    }
</script>
</body>
</html>
