<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Bulk Import Books')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5" style="max-width: 760px;">
    <span class="eyebrow d-block mb-2">Librarian tools</span>
    <h4 class="mb-1">Bulk Import Books</h4>
    <p class="text-muted mb-4">Paste a JSON array of books - faster than filling out the form one at a time.</p>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-danger" th:if="${errors}">
        <strong>Some rows were skipped:</strong>
        <ul class="mb-0">
            <li th:each="e : ${errors}" th:text="${e}"></li>
        </ul>
    </div>

    <div class="form-panel p-4">
        <form th:action="@{/admin/books/import}" method="post">
            <label for="json" class="form-label">Books (JSON array)</label>
            <textarea id="json" name="json" class="form-control" rows="16" style="font-family: var(--font-mono); font-size: 0.85rem;"
                      th:text="${submittedJson}"></textarea>
            <button type="submit" class="btn btn-primary mt-3">Import</button>
        </form>
    </div>

    <details class="mt-4">
        <summary class="eyebrow" style="cursor:pointer;">Expected format</summary>
        <pre class="form-panel p-3 mt-2" style="font-size: 0.8rem; overflow-x: auto;" th:text="${exampleJson}"></pre>
        <p class="text-muted small">Each book needs 1&ndash;10 takeaways. Rows that fail validation are skipped and listed above - everything else still imports.</p>
    </details>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
