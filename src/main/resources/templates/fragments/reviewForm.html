<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The star rating + optional comment form, shared by the "You finished" page and the reader:
       fragments/reviewForm :: reviewForm(book, ownReview)
       - ownReview: the reader's existing review of this book, or null.
       Only one of those two pages is ever on screen, so the star ids below never clash. */-->
<th:block th:fragment="reviewForm(book, ownReview)">
    <div class="alert alert-danger" th:if="${reviewError}" th:text="${#messages.msgOrNull(reviewError) ?: reviewError}"></div>
    <form th:action="@{/available_books/{id}/review(id=${book.id})}" method="post">
        <div class="star-rating mb-3">
            <input type="radio" id="star5" name="rating" value="5" required
                   th:checked="${ownReview != null and ownReview.rating == 5}">
            <label for="star5" title="5 stars" th:title="#{bookRead.5.stars}"><i class="fa-solid fa-star"></i></label>
            <input type="radio" id="star4" name="rating" value="4" required
                   th:checked="${ownReview != null and ownReview.rating == 4}">
            <label for="star4" title="4 stars" th:title="#{bookRead.4.stars}"><i class="fa-solid fa-star"></i></label>
            <input type="radio" id="star3" name="rating" value="3" required
                   th:checked="${ownReview != null and ownReview.rating == 3}">
            <label for="star3" title="3 stars" th:title="#{bookRead.3.stars}"><i class="fa-solid fa-star"></i></label>
            <input type="radio" id="star2" name="rating" value="2" required
                   th:checked="${ownReview != null and ownReview.rating == 2}">
            <label for="star2" title="2 stars" th:title="#{bookRead.2.stars}"><i class="fa-solid fa-star"></i></label>
            <input type="radio" id="star1" name="rating" value="1" required
                   th:checked="${ownReview != null and ownReview.rating == 1}">
            <label for="star1" title="1 star" th:title="#{bookRead.1.star}"><i class="fa-solid fa-star"></i></label>
        </div>
        <textarea name="comment" class="form-control mb-3" rows="3" maxlength="2000"
                  placeholder="What did you think? (optional)" th:placeholder="#{bookRead.what.did.you.think.optional}"
                  th:text="${ownReview != null ? ownReview.comment : ''}"></textarea>
        <button type="submit" class="btn btn-primary btn-sm"
                th:text="${ownReview != null} ? #{bookRead.update.review} : #{bookRead.submit.review}">Submit review</button>
    </form>
    <form th:if="${ownReview != null}"
          th:action="@{/available_books/{bookId}/review/{reviewId}/delete(bookId=${book.id}, reviewId=${ownReview.id})}"
          method="post" class="d-inline mt-2"
          onsubmit="return appConfirm(event);" th:data-confirm="#{confirm.delete.review}">
        <button th:text="#{bookRead.delete.my.review}" type="submit" class="btn btn-link btn-sm text-danger p-0">Delete my review</button>
    </form>
</th:block>
</body>
</html>
