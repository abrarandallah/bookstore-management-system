<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--/* One pinned Bootstrap version (layout/grid only) + the site's own design system on top. */-->
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title} + ' - BookStore'">BookStore</title>
        <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
              integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
              crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </th:block>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
    </th:block>

    <!--/* Shared by bookRegister.html and bookEdit.html - dynamic add/remove
           for the takeaway rows, always re-numbering "name" attributes to a
           contiguous 0..N-1 range so Spring's indexed list binding never
           sees a gap. */-->
    <th:block th:fragment="takeawayFormScript">
        <script>
            function renumberTakeaways() {
                document.querySelectorAll('#takeaways-container .takeaway-row').forEach((row, index) => {
                    row.querySelectorAll('[data-field]').forEach((el) => {
                        el.setAttribute('name', 'takeaways[' + index + '].' + el.getAttribute('data-field'));
                    });
                });
            }
            function removeTakeaway(button) {
                const rows = document.querySelectorAll('#takeaways-container .takeaway-row');
                if (rows.length <= 1) {
                    alert('You need at least 1 takeaway.');
                    return;
                }
                button.closest('.takeaway-row').remove();
                renumberTakeaways();
            }
            function addTakeaway() {
                const container = document.getElementById('takeaways-container');
                if (container.querySelectorAll('.takeaway-row').length >= 10) {
                    alert('Maximum 10 takeaways.');
                    return;
                }
                const row = document.createElement('div');
                row.className = 'takeaway-row mb-3 p-3';
                row.innerHTML =
                    '<div class="d-flex justify-content-between align-items-center mb-2">' +
                    '<span class="eyebrow">Takeaway</span>' +
                    '<button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removeTakeaway(this)">Remove</button>' +
                    '</div>' +
                    '<input type="text" class="form-control mb-2" data-field="heading" placeholder="Heading">' +
                    '<textarea class="form-control" data-field="content" rows="3" placeholder="What\'s the key idea?"></textarea>';
                container.appendChild(row);
                renumberTakeaways();
            }
        </script>
    </th:block>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg site-header">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-feather-pointed brand-mark"></i>
                <span>BookStore</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/available_books">Available Books</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/my_books">My Books</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('LIBRARIAN')">
                        <a class="nav-link" href="/book_register">New Book Register</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('LIBRARIAN')">
                        <a class="nav-link" href="/admin/users">Admin</a>
                    </li>
                </ul>
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" href="/register">Register</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/profile">Profile</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="px-3">
                            <button type="submit" class="nav-link logout-link">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="site-footer">
        <div class="container d-flex flex-wrap justify-content-between gap-3">
            <div>
                <i class="fa-solid fa-feather-pointed brand-mark"></i>
                <strong>BookStore</strong> — every book has a spine, every spine tells you something.
            </div>
            <div>
                <a href="/">Home</a>
                <span class="mx-2">·</span>
                <a href="/available_books">Available Books</a>
            </div>
        </div>
    </footer>
</body>
</html>
