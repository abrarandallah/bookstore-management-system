<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Finished!')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container mt-5 mb-5 text-center">
    <div class="empty-state" style="max-width: 560px; margin: 0 auto;">
        <span class="eyebrow">Nice work</span>
        <h3>You finished <span th:text="${book.name}">Book title</span>!</h3>
        <img th:if="${book.coverImageUrl}" th:src="@{${book.coverImageUrl}}" alt="Cover"
             style="width:96px;height:auto;border-radius:6px;box-shadow:var(--shadow-card);margin: 1rem 0;">

        <div th:if="${!#lists.isEmpty(newAchievements)}" class="mt-3 mb-4">
            <span class="eyebrow d-block mb-3">Achievement unlocked</span>
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <div th:each="a : ${newAchievements}" class="achievement-badge p-3"
                     style="border: 1px solid var(--border-soft); border-radius: 10px; min-width: 160px;">
                    <div style="font-size: 2rem;" th:text="${a.icon}">🏆</div>
                    <div class="fw-semibold mt-1" th:text="${a.name}">Achievement name</div>
                    <div class="small text-muted" th:text="${a.description}">Description</div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="/available_books" class="btn btn-primary">Keep browsing</a>
            <a href="/reading-history" class="btn btn-secondary">My reading history</a>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
