
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(#{verifyEmailInvalid.verification.link.invalid})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container mt-5 mb-5 text-center">
    <div class="empty-state" style="max-width: 480px; margin: 0 auto;">
        <span th:text="#{verifyEmailInvalid.link.expired}" class="eyebrow">Link expired</span>
        <h3 th:text="#{verifyEmailInvalid.verification.link.invalid.1}">Verification link invalid</h3>
        <p th:text="${error}"></p>
        <a th:text="#{verifyEmailInvalid.request.a.new.link}" class="btn btn-primary" href="/resend-verification">Request a new link</a>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
