<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Profile')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <div class="auth-card text-center">
                <img th:if="${user.avatarUrl}" th:src="@{${user.avatarUrl}}" alt="Avatar"
                     class="rounded-circle mx-auto mb-3" style="width:88px;height:88px;object-fit:cover;box-shadow:var(--shadow-card);">
                <div th:unless="${user.avatarUrl}"
                     class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center"
                     style="width:88px;height:88px;background:var(--ink);color:var(--paper-raised);font-family:var(--font-display);font-size:2rem;"
                     th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">U</div>

                <h5 class="mb-1" th:text="${user.username}"></h5>
                <p class="text-muted mb-2" th:text="${user.email}"></p>
                <span class="pill-tag" th:text="${user.role == 'ROLE_LIBRARIAN'} ? 'Librarian' : 'Reader'"></span>
                <span class="pill-tag" th:if="${finishedBooksCount >= 15}" style="margin-left: 6px;">🔥 Voracious Reader</span>
                <span class="pill-tag" th:if="${finishedBooksCount >= 5 and finishedBooksCount < 15}" style="margin-left: 6px;">🐛 Bookworm</span>
                <span class="pill-tag" th:if="${finishedBooksCount >= 1 and finishedBooksCount < 5}" style="margin-left: 6px;">📖 First Chapter</span>

                <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data"
                      class="d-flex justify-content-center align-items-center gap-2 mt-3">
                    <input type="file" name="avatar" class="form-control form-control-sm" style="max-width: 220px;"
                           accept="image/png,image/jpeg,image/webp,image/gif" required>
                    <button type="submit" class="btn btn-outline-brass btn-sm">Update photo</button>
                </form>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-sm-6">
                    <a href="/my_books" class="profile-stat-card text-decoration-none">
                        <span class="profile-stat-card-icon"><i class="fa-solid fa-bookmark"></i></span>
                        <span>
                            <span class="profile-stat-card-number" th:text="${myBooksCount}">0</span>
                            <span class="profile-stat-card-label d-block">My Books</span>
                        </span>
                        <span class="profile-stat-card-arrow"><i class="fa-solid fa-arrow-right"></i></span>
                    </a>
                </div>
                <div class="col-sm-6">
                    <a href="/reading-history" class="profile-stat-card text-decoration-none">
                        <span class="profile-stat-card-icon"><i class="fa-solid fa-book-open-reader"></i></span>
                        <span>
                            <span class="profile-stat-card-number" th:text="${finishedBooksCount}">0</span>
                            <span class="profile-stat-card-label d-block">Books Finished</span>
                        </span>
                        <span class="profile-stat-card-arrow"><i class="fa-solid fa-arrow-right"></i></span>
                    </a>
                </div>
            </div>

            <div class="form-panel p-4 mt-3">
                <span class="eyebrow d-block mb-3">Achievements <span class="text-muted" th:text="'(' + ${#lists.size(achievements)} + ')'"></span></span>
                <p class="text-muted small" th:if="${#lists.isEmpty(achievements)}">
                    Finish a book to start unlocking achievements - see your progress on the
                    <a href="/reading-history">Reading History</a> page.
                </p>
                <div class="d-flex flex-wrap gap-3" th:unless="${#lists.isEmpty(achievements)}">
                    <div th:each="ua : ${achievements}" class="medal medal-compact badge-pop"
                         th:title="${ua.achievement.description}">
                        <div class="medal-seal">
                            <div class="medal-seal-face">
                                <span class="medal-icon" th:text="${ua.achievement.icon}">🏆</span>
                            </div>
                        </div>
                        <div class="medal-name" th:text="${ua.achievement.name}">Achievement</div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="/settings" class="text-muted small">
                    <i class="fa-solid fa-gear me-1"></i> Account settings, password, and more
                </a>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
