
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead(#{admin_users.manage.users})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 th:text="#{admin_users.manage.users}" class="mb-1">Manage Users</h4>
            <p th:text="#{admin_users.promote.readers.to.librarian.or}" class="text-muted mb-0">Promote readers to librarian, or reset anyone's password.</p>
        </div>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="row g-3 mb-4">
        <div class="col-sm-4">
            <div class="card text-center py-3">
                <div class="fs-3 fw-bold" th:text="${totalUsers}">0</div>
                <div th:text="#{admin_users.total.users}" class="text-muted small">Total users</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card text-center py-3">
                <div class="fs-3 fw-bold" th:text="${librarianCount}">0</div>
                <div th:text="#{admin_users.librarians}" class="text-muted small">Librarians</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card text-center py-3">
                <div class="fs-3 fw-bold" th:text="${readerCount}">0</div>
                <div th:text="#{admin_users.readers}" class="text-muted small">Readers</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th th:text="#{admin_users.user}">User</th>
                <th th:text="#{admin_users.email}">Email</th>
                <th th:text="#{admin_users.role}">Role</th>
                <th th:text="#{admin_users.change.role}">Change Role</th>
                <th th:text="#{admin_users.reset.password}">Reset Password</th>
                <th th:text="#{admin_users.delete}">Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center"
                             style="width:32px;height:32px;font-size:0.85rem;flex-shrink:0;"
                             th:text="${#strings.toUpperCase(#strings.substring(u.username,0,1))}">U</div>
                        <span th:text="${u.username}"></span>
                    </div>
                </td>
                <td th:text="${u.email}"></td>
                <td>
                    <span class="badge" th:classappend="${u.role == 'ROLE_LIBRARIAN'} ? 'bg-dark' : 'bg-secondary'"
                          th:text="${u.role == 'ROLE_LIBRARIAN'} ? 'Librarian' : 'Reader'"></span>
                </td>
                <td>
                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-2">
                        <select name="role" class="form-select form-select-sm" style="width: auto;">
                            <option th:text="#{admin_users.reader}" value="ROLE_USER" th:selected="${u.role == 'ROLE_USER'}">Reader</option>
                            <option th:text="#{admin_users.librarian}" value="ROLE_LIBRARIAN" th:selected="${u.role == 'ROLE_LIBRARIAN'}">Librarian</option>
                        </select>
                        <button th:text="#{admin_users.save}" type="submit" class="btn btn-sm btn-outline-secondary">Save</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post" class="d-flex gap-2">
                        <input type="password" name="newPassword" class="form-control form-control-sm"
                               placeholder="New password" th:placeholder="#{admin_users.new.password}" minlength="8" required style="width: 160px;">
                        <button th:text="#{admin_users.reset}" type="submit" class="btn btn-sm btn-outline-danger">Reset</button>
                    </form>
                </td>
                <td>
                    <form th:if="${u.usernameOrEmail != #authentication.name}"
                          th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                          onsubmit="return appConfirm(event, 'Permanently delete this user and everything tied to their account? This cannot be undone.');">
                        <button th:text="#{admin_users.delete}" type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                    <span th:text="#{admin_users.that.s.you}" th:unless="${u.usernameOrEmail != #authentication.name}" class="text-muted small">That's you</span>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>

    <nav class="pagination-controls mt-4" th:if="${pagination != null and pagination.totalPages > 1}"
         aria-label="User list pages" th:aria-label="#{admin_users.user.list.pages}">
        <a th:if="${pagination.hasPrevious}" class="page-link"
           th:href="@{/admin/users(page=${pagination.page - 1})}"
           th:attr="data-page=${pagination.page - 1}" aria-label="Previous page" th:aria-label="#{admin_users.previous.page}">
            <i class="fa-solid fa-chevron-left"></i>
        </a>
        <span th:unless="${pagination.hasPrevious}" class="page-link disabled" aria-hidden="true">
            <i class="fa-solid fa-chevron-left"></i>
        </span>

        <th:block th:each="p : ${#numbers.sequence(1, pagination.totalPages)}">
            <span th:if="${p == pagination.page}" class="page-link active" th:text="${p}"></span>
            <a th:unless="${p == pagination.page}" class="page-link"
               th:href="@{/admin/users(page=${p})}"
               th:attr="data-page=${p}" th:text="${p}"></a>
        </th:block>

        <a th:if="${pagination.hasNext}" class="page-link"
           th:href="@{/admin/users(page=${pagination.page + 1})}"
           th:attr="data-page=${pagination.page + 1}" aria-label="Next page" th:aria-label="#{admin_users.next.page}">
            <i class="fa-solid fa-chevron-right"></i>
        </a>
        <span th:unless="${pagination.hasNext}" class="page-link disabled" aria-hidden="true">
            <i class="fa-solid fa-chevron-right"></i>
        </span>
    </nav>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
