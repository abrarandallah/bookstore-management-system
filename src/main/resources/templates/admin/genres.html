<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Manage Genres')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1">Manage Genres</h4>
            <p class="text-muted mb-0">Add or remove the shelf categories books can be tagged with.</p>
        </div>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/admin/genres}" method="post" class="d-flex gap-2">
                <input type="text" name="name" class="form-control" placeholder="New genre name"
                       maxlength="100" required>
                <button type="submit" class="btn btn-primary flex-shrink-0">Add genre</button>
            </form>
        </div>
    </div>

    <div th:if="${#maps.isEmpty(genreCounts)}" class="text-muted">No genres yet - add one above.</div>

    <div class="card" th:unless="${#maps.isEmpty(genreCounts)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Genre</th>
                <th>Books</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${genreCounts}">
                <td th:text="${entry.key.name}"></td>
                <td th:text="${entry.value}"></td>
                <td class="text-end">
                    <form th:action="@{/admin/genres/{id}/delete(id=${entry.key.id})}" method="post"
                          onsubmit="return appConfirm(event, 'Delete this genre? Books tagged with it will just lose the tag.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
