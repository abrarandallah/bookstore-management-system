<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Login')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card p-4">
                <h4>Welcome back</h4>
                <div class="alert alert-success" th:if="${param.registered != null}">
                    Account created successfully. Please log in.
                </div>
                <div class="alert alert-success" th:if="${param.reset != null}">
                    Your password has been reset. Please log in.
                </div>
                <div class="alert alert-success" th:if="${param.accountDeleted != null}">
                    Your account has been deleted.
                </div>
                <div class="alert alert-danger" th:if="${param.error != null}">
                    Invalid username/email or password.
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="usernameOrEmail" class="form-label">Username or Email</label>
                        <input type="text" class="form-control" id="usernameOrEmail" name="usernameOrEmail" placeholder="Enter your username or email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    <div class="text-center mt-3">
                        <a href="/forgot-password">Forgot password?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
