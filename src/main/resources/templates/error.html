<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Oops')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container mt-5 mb-5 text-center">
    <div class="empty-state" style="max-width: 480px; margin: 0 auto;">
        <span class="eyebrow">Something went wrong</span>
        <h3>Oops</h3>
        <p th:text="${message} ?: 'Something went wrong.'">Something went wrong.</p>
        <a class="btn btn-primary" href="/">Back to Home</a>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
