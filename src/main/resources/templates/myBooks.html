<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('My Books')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
    <div class="container my-5">
        <div class="section-heading">
            <div>
                <span class="eyebrow">Your collection</span>
                <h2>My Books</h2>
            </div>
            <a th:href="@{/available_books}" class="btn btn-outline-brass">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Browse more books
            </a>
        </div>

        <div th:if="${#lists.isEmpty(book)}" class="empty-state">
            <span class="eyebrow">Nothing here yet</span>
            <h3>Your shelf is bare</h3>
            <p>You haven't added any books to your collection yet.</p>
            <a th:href="@{/available_books}" class="btn btn-primary">Browse available books</a>
        </div>

        <div class="book-grid" th:unless="${#lists.isEmpty(book)}">
            <div class="book-card" th:each="b : ${book}"
                 th:style="'--spine-color: hsl(' + ${T(java.lang.Math).abs(b.name.hashCode()) % 360} + ', 42%, 34%)'">
                <div class="book-author" th:text="${b.author}">Author</div>
                <div class="book-title" th:text="${b.name}">Book title</div>
                <div class="book-actions">
                    <form th:action="@{/deleteMyBook/{id}(id=${b.id})}" method="post"
                          onsubmit="return confirm('Remove this book from your list?');">
                        <button type="submit" class="btn btn-link p-0 icon-link danger" style="border:none;background:none;">
                            <i class="fa-solid fa-trash"></i> <span class="small">Remove</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
