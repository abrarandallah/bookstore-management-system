<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register a Book')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5 p-5 form-panel" style="max-width: 600px;">
    <h4 class="text-center">New Book Register</h4>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/save}" method="post" th:object="${book}">
        <div class="mb-3">
            <label for="name" class="form-label">Book Name</label>
            <input type="text" id="name" class="form-control" name="name" th:value="${book?.name}">
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">The Author</label>
            <input type="text" id="author" class="form-control" name="author" th:value="${book?.author}">
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="text" id="price" class="form-control" name="price" th:value="${book?.price}">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
