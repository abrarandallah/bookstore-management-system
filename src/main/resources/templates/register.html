
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(#{register.register})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body" id="main-content">
<div class="container my-4 my-md-5">
    <div class="auth-split">
        <div th:replace="~{fragments/authAside :: aside(#{auth.aside.register.title}, #{auth.aside.register.sub})}"></div>
        <div class="auth-main">
            <div class="auth-card p-4" data-auth="register">
                <button type="button" class="auth-sfx-toggle" id="auth-sfx-toggle" aria-pressed="true"
                        th:data-on="#{auth.sound.on}" th:data-off="#{auth.sound.off}"
                        title="Sound effects" th:title="#{auth.sound.on}" th:aria-label="#{auth.sound.on}">
                    <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
                </button>
                <div class="auth-badge" aria-hidden="true"><i class="fa-solid fa-user-plus"></i></div>
                <h1 class="auth-heading" th:text="#{register.create.an.account}">Create an account</h1>
                <div class="alert alert-danger" th:if="${error}" th:text="${#messages.msgOrNull(error) ?: error}"></div>
                <form th:action="@{/register}" th:object="${signupRequest}" method="post">
                    <div class="mb-3">
                        <label th:text="#{register.username}" for="username" class="form-label">Username</label>
                        <div class="auth-field">
                            <i class="fa-solid fa-user auth-field-icon" aria-hidden="true"></i>
                            <input type="text" class="form-control" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false"
                                   th:value="${signupRequest?.username}" placeholder="Enter your username" th:placeholder="#{register.enter.your.username}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label th:text="#{register.email}" for="email" class="form-label">Email</label>
                        <div class="auth-field">
                            <i class="fa-solid fa-envelope auth-field-icon" aria-hidden="true"></i>
                            <input type="email" class="form-control" id="email" name="email" autocomplete="email" autocapitalize="off" spellcheck="false"
                                   th:value="${signupRequest?.email}" placeholder="Enter your email" th:placeholder="#{register.enter.your.email}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label th:text="#{register.password}" for="password" class="form-label">Password</label>
                        <div class="auth-field">
                            <i class="fa-solid fa-lock auth-field-icon" aria-hidden="true"></i>
                            <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" aria-describedby="password-hint" placeholder="Enter your password" th:placeholder="#{register.enter.your.password}" required>
                        </div>
                        <div class="auth-strength" id="auth-strength" hidden
                             th:data-weak="#{auth.strength.weak}" th:data-fair="#{auth.strength.fair}"
                             th:data-good="#{auth.strength.good}" th:data-strong="#{auth.strength.strong}">
                            <span class="auth-strength-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                            <span class="auth-strength-label" aria-live="polite"></span>
                        </div>
                        <div id="password-hint" class="form-text" th:text="#{register.password.hint}">Use at least 8 characters.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-auth">
                        <span th:text="#{register.register}">Register</span> <i class="fa-solid fa-arrow-right ms-1" aria-hidden="true"></i>
                    </button>
                    <p class="auth-quick" th:text="#{auth.register.quick}">Takes about 20 seconds.</p>
                    <div class="auth-divider"><span th:text="#{auth.or}">or</span></div>
                    <div class="auth-alt">
                        <a href="/login" class="btn btn-outline-brass w-100"><i class="fa-solid fa-right-to-bracket me-1" aria-hidden="true"></i> <span th:text="#{register.already.have.an.account.log}">Already have an account? Log in</span></a>
                        <a href="/available_books" class="auth-guest"><i class="fa-solid fa-book-open me-1" aria-hidden="true"></i> <span th:text="#{auth.continue.guest}">Just browsing? Continue as a guest</span></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/auth-fx.js}"></script>
</body>
</html>
