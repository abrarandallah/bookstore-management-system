<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Genres')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
    <div class="container my-5">
        <div class="section-heading">
            <div>
                <span class="eyebrow">Browse by</span>
                <h2>Genres</h2>
            </div>
        </div>

        <div th:if="${#maps.isEmpty(genreCounts)}" class="empty-state">
            <span class="eyebrow">Nothing here yet</span>
            <h3>No genres yet</h3>
            <p>Genres will show up here once a librarian adds some.</p>
        </div>

        <div class="row g-3" th:unless="${#maps.isEmpty(genreCounts)}">
            <div class="col-6 col-md-4 col-lg-3" th:each="entry : ${genreCounts}">
                <a class="genre-tile" th:href="@{/available_books(genre=${entry.key.id})}">
                    <div class="genre-tile-name" th:text="${entry.key.name}">Genre</div>
                    <div class="genre-tile-count"
                         th:text="${entry.value + (entry.value == 1 ? ' book' : ' books')}">0 books</div>
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
