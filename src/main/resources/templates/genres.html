<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Genres')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container my-5">
    <span class="eyebrow d-block mb-2">Browse</span>
    <h4 class="mb-1">Genres</h4>
    <p class="text-muted mb-4">Pick a genre to see the books shelved under it.</p>

    <div th:if="${#maps.isEmpty(genreCounts)}" class="text-muted">No genres yet.</div>

    <div class="row g-3" th:unless="${#maps.isEmpty(genreCounts)}">
        <div class="col-sm-6 col-md-4 col-lg-3" th:each="entry : ${genreCounts}">
            <a class="card h-100 text-decoration-none text-reset"
               th:href="@{/available_books(genre=${entry.key.id})}">
                <div class="card-body">
                    <div class="fw-semibold" th:text="${entry.key.name}"></div>
                    <div class="text-muted small" th:text="${entry.value} + (${entry.value == 1} ? ' book' : ' books')"></div>
                </div>
            </a>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
