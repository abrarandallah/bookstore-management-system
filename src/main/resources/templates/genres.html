<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead(#{genres.genres})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body" id="main-content">
<div class="container my-5">
    <span th:text="#{genres.browse}" class="eyebrow d-block mb-2">Browse</span>
    <h4 th:text="#{genres.genres}" class="mb-1">Genres</h4>
    <p th:text="#{genres.pick.a.genre.to.see}" class="text-muted mb-4">Pick a genre to see the books shelved under it.</p>

    <div th:text="#{genres.no.genres.yet}" th:if="${#maps.isEmpty(genreCounts)}" class="text-muted">No genres yet.</div>

    <th:block th:unless="${#maps.isEmpty(genreCounts)}">
    <div class="genre-toolbar" id="genre-toolbar">
        <input type="search" id="genre-filter" class="form-control genre-search"
               th:placeholder="#{genres.filter.placeholder}" th:aria-label="#{genres.filter.placeholder}"
               autocomplete="off">
        <div class="genre-sort" role="group" th:aria-label="#{genres.sort.label}">
            <button type="button" class="genre-sort-btn is-active" data-sort="az" aria-pressed="true" th:text="#{genres.sort.az}">A-Z</button>
            <button type="button" class="genre-sort-btn" data-sort="most" aria-pressed="false" th:text="#{genres.sort.most}">Most books</button>
        </div>
        <span class="genre-total text-muted small" th:text="#{genres.total(${#maps.size(genreCounts)})}"></span>
    </div>

    <div class="row g-3" id="genre-grid">
        <div class="col-sm-6 col-md-4 col-lg-3 genre-col" th:each="entry, stat : ${genreCounts}"
             th:with="gname=${@genreLocalizer.localizeName(entry.key.name, #locale.language)}"
             th:attr="data-name=${#strings.toLowerCase(gname + ' ' + entry.key.name)},data-label=${gname},data-count=${entry.value}">
            <a class="genre-card text-decoration-none" th:classappend="'genre-tone-' + ${stat.index % 4}"
               th:href="@{/available_books(genre=${entry.key.id})}">
                <span class="genre-initial" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(gname, 0, 1))}">A</span>
                <span class="genre-info">
                    <span class="genre-name" th:text="${gname}"></span>
                    <span class="genre-count" th:text="${entry.value == 1} ? #{genres.book.count.one(${entry.value})} : #{genres.book.count.other(${entry.value})}"></span>
                    <span class="genre-bar" aria-hidden="true"><span class="genre-bar-fill"></span></span>
                </span>
                <span class="genre-arrow" aria-hidden="true">&rarr;</span>
            </a>
        </div>
    </div>
    <p class="text-muted mt-4 d-none" id="genre-empty" th:text="#{genres.no.match}">No genre matches your search.</p>
    </th:block>

    <div class="card mt-5" sec:authorize="hasRole('LIBRARIAN')" th:unless="${#maps.isEmpty(genreCounts)}">
        <div class="card-header">
            <span th:text="#{genres.manage.genres}" class="fw-semibold">Manage Genres</span>
            <span th:text="#{genres.fix.a.typo.or.merge}" class="text-muted small d-block d-sm-inline ms-sm-2">Fix a typo, or merge a duplicate into an existing genre.</span>
        </div>
        <div class="alert alert-danger m-3 mb-0" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success m-3 mb-0" th:if="${message}" th:text="${message}"></div>
        <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th th:text="#{genres.genre}">Genre</th>
                <th th:text="#{genres.books}">Books</th>
                <th th:text="#{genres.rename}">Rename</th>
                <th th:text="#{genres.merge.into}">Merge into</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="entry : ${genreCounts}">
                <td th:text="${entry.key.name}"></td>
                <td th:text="${entry.value}"></td>
                <td>
                    <form th:action="@{/admin/genres/{id}/rename(id=${entry.key.id})}" method="post" class="d-flex gap-2">
                        <input type="text" name="name" class="form-control form-control-sm"
                               th:value="${entry.key.name}" required style="width: 160px;">
                        <button th:text="#{genres.save}" type="submit" class="btn btn-sm btn-outline-secondary">Save</button>
                    </form>
                </td>
                <td>
                    <form th:if="${#maps.size(genreCounts) > 1}"
                          th:action="@{/admin/genres/{id}/merge(id=${entry.key.id})}" method="post" class="d-flex gap-2"
                          onsubmit="return appConfirm(event);" th:data-confirm="#{confirm.merge.genre}">
                        <select name="targetId" class="form-select form-select-sm" style="width: auto;">
                            <th:block th:each="target : ${genreCounts}">
                                <option th:if="${target.key.id != entry.key.id}"
                                        th:value="${target.key.id}" th:text="${target.key.name}"></option>
                            </th:block>
                        </select>
                        <button th:text="#{genres.merge}" type="submit" class="btn btn-sm btn-outline-danger">Merge</button>
                    </form>
                    <span th:text="#{genres.only.genre}" th:unless="${#maps.size(genreCounts) > 1}" class="text-muted small">Only genre</span>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/genres.js}"></script>
</body>
</html>
