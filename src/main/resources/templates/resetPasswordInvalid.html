
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(#{resetPasswordInvalid.reset.link.invalid})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
<div class="container mt-5 mb-5 text-center">
    <div class="empty-state" style="max-width: 480px; margin: 0 auto;">
        <span th:text="#{resetPasswordInvalid.link.expired}" class="eyebrow">Link expired</span>
        <h3 th:text="#{resetPasswordInvalid.reset.link.invalid.1}">Reset link invalid</h3>
        <p th:text="${error}"></p>
        <a th:text="#{resetPasswordInvalid.request.a.new.link}" class="btn btn-primary" href="/forgot-password">Request a new link</a>
    </div>
</div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
