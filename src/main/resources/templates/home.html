<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: pageHead('Home')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="page-body">
    <div class="container hero-section">
        <div class="row align-items-center g-5">
            <div class="col-lg-6 hero-copy">
                <span class="eyebrow">Independently stocked, one shelf at a time</span>
                <h1>Welcome to BookStore</h1>
                <p>
                    We hope you find what you're looking for in here. This shop holds books we found
                    interesting, unusual, or hard to put down. If you're a bookworm, have a good read —
                    and keep it up.
                </p>
                <div class="d-flex gap-2 flex-wrap">
                    <a href="/login" class="btn btn-primary" sec:authorize="isAnonymous()">Login</a>
                    <a href="/register" class="btn btn-outline-brass" sec:authorize="isAnonymous()">Create an account</a>
                    <a href="/available_books" class="btn btn-primary" sec:authorize="isAuthenticated()">Browse Books</a>
                </div>
            </div>
            <div class="col-lg-6 text-center">
                <div class="hero-figure">
                    <img src="/bg.jpg" alt="A library section" style="max-width: 460px;"/>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
