about.most.books.have.a.handful=La plupart des livres contiennent une poignée d'idées qui valent la peine d'être retenues, noyées dans des centaines de pages d'histoire, d'exemples et de répétitions. BookStore réduit cela à l'essentiel : chaque livre ici est condensé en 1–10 idées clés courtes — quelques phrases chacune, capturant l'idée centrale plutôt que l'argument complet.
about.it.s.meant.for.a=Il est destiné pour un premier goût d'un livre que vous décidez de lire en entier, ou pour quand vous voulez juste la partie utile sans l'engagement de temps. Un livre typique prend quelques minutes à lire ici, pas quelques heures.
