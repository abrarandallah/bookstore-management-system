about.most.books.have.a.handful=La plupart des livres contiennent une poignée d'idées qui valent la peine d'être retenues, noyées dans des centaines de pages d'histoire, d'exemples et de répétitions. BookStore réduit cela à l'essentiel : chaque livre ici est condensé en 1–10 points clés courts — quelques phrases chacune, capturant l'idée centrale plutôt que l'argument complet.
about.it.s.meant.for.a=Il est conçu pour offrir un premier aperçu d'un livre dont vous hésitez à entreprendre la lecture complète, ou pour les moments où vous voulez seulement l'essentiel, sans y consacrer beaucoup de temps. Un livre typique se lit ici en quelques minutes, pas en quelques heures.
