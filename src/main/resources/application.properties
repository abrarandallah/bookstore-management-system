server.port=8081
spring.datasource.name=book
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:book}?ServerTimezone=UTC
spring.datasource.username=${DB_USERNAME:abrar}
spring.datasource.password=${DB_PASSWORD:abrar}

spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is now managed by Flyway (see src/main/resources/db/migration),
# not Hibernate - validate just checks the JPA mappings agree with
# whatever schema Flyway has produced, it never changes the schema itself.
spring.jpa.hibernate.ddl-auto=validate

# On a database Flyway has never touched before but that already HAS
# tables in it (i.e. an existing deployment that used to run under
# ddl-auto=update), this tells Flyway "treat the current schema as if
# V1 had already run" instead of trying to run V1's CREATE TABLEs
# against tables that already exist. A genuinely empty database (a
# fresh `docker compose up`) doesn't hit this path at all - Flyway just
# runs V1 normally there. See db/migration/V1__baseline.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Exposes /actuator/health for container/orchestrator readiness and
# liveness checks (see docker-compose.yml's app healthcheck). Nothing
# else under /actuator/** is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration. JWT_SECRET is auto-generated and saved to
# <your home directory>/.bookstore-jwt-secret on first run if you don't set
# it yourself - see JwtSecretEnvironmentPostProcessor. The value below is
# only used as a last-resort fallback if that auto-generation somehow
# fails - it MUST be valid base64 decoding to at least 64 bytes (512
# bits), since JwtTokenProvider signs with HS512 via
# Keys.hmacShaKeyFor(), which rejects anything shorter. Generate your own
# with: openssl rand -base64 64
app.jwtSecret=${JWT_SECRET:PDM6hA5amHev/xkRTc5UXLKge/3YXanM7PVg0R9LDzcUbYnryc62GUC2XjeFKgLfie6yKdJAAUOeTEzcHs3xQQ==}
app.jwtExpirationInMs=86400000

# Where uploaded cover images and avatars are saved. Relative paths resolve
# against wherever the app is started from - set an absolute path via
# UPLOAD_DIR if that's not where you want them (e.g. in production).
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Default librarian account, created on startup if no librarian exists yet.
# There's no admin UI to promote users, so this is the only way in for now.
app.librarian.username=${LIBRARIAN_USERNAME:librarian}
app.librarian.email=${LIBRARIAN_EMAIL:librarian@bookstore.local}
app.librarian.password=${LIBRARIAN_PASSWORD:change-this-password}

# Used to build the link in password-reset emails, e.g. http://localhost:8081
app.base-url=${APP_BASE_URL:http://localhost:8081}

# SMTP settings for the forgot-password email. Without real values here,
# reset tokens still get created but the email won't actually be delivered
# (failures are logged, not shown to the user - see EmailService).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# If your network blocks port 587, switch to SSL on 465 instead by setting:
#   MAIL_PORT=465
#   MAIL_SSL_ENABLE=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}